[project]
name = "sleeper-mcp"
version = "0.1.0"
description = "An MCP server for Sleeper fantasy football — rosters, matchups, news, waivers, trades, lineups and pick'em"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# What scripts/check.py needs to check anything. pytest so the suite actually
# runs rather than skipping modules it cannot import; pyflakes because a name
# used but never imported is a NameError at call time, invisible to syntax
# checking, and ships green when no test exercises that tool.
dev = ["pytest>=7", "pytest-asyncio>=0.23", "pyflakes>=3",
       "coverage>=7"]

[project.urls]
Homepage = "https://github.com/bealmot/sleeper-mcp"

[project.scripts]
sleeper-mcp = "sleeper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Without this every async test is SKIPPED rather than failed, and the suite
# still reports success — the same shape as a gate that stops checking.
asyncio_mode = "auto"
