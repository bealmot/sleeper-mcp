[project]
name = "sleeper-mcp"
version = "0.1.0"
description = "An MCP server for Sleeper fantasy football — rosters, matchups, news, waivers, trades, lineups and pick'em"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/bealmot/sleeper-mcp"

[project.scripts]
sleeper-mcp = "sleeper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
