# Runs scripts/check.py, the same gate as the pre-push hook, on every push to
# main and every pull request. check.py says why each check exists; this file
# only chooses the environments.
#
#   3.10 latest   the oldest Python in requires-python, newest dependencies
#   3.12 latest   plus --fresh: a clean venv resolves and imports, which
#                 catches a new dependency release that breaks the server
#   3.10 floor    mcp pinned to the floor in pyproject.toml, so the 1.x
#                 branch of the SDK shim in client.py actually runs

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.python }} ${{ matrix.floor && 'mcp floor' || 'latest' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
          - python: "3.12"
            fresh: true
          - python: "3.10"
            floor: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        if: ${{ !matrix.floor }}
        run: pip install -e '.[dev]'
      - name: Install with mcp at the floor in pyproject.toml
        if: matrix.floor
        # ONE resolve, never install-then-downgrade: a downgrade from 2.x
        # leaves mcp-types behind. mcp 1.7.0 sets no upper bound on pydantic
        # and does not import with pydantic 2.12 or later, so that pin is part
        # of the floor, not a workaround.
        run: |
          floor=$(grep -oE '"mcp>=[0-9.]+' pyproject.toml | cut -d= -f2)
          test -n "$floor" || { echo "no mcp floor found in pyproject.toml"; exit 1; }
          pip install -e '.[dev]' "mcp==$floor" "pydantic<2.12"
          pip show mcp pydantic | grep -E '^(Name|Version)'
          if pip show mcp-types >/dev/null 2>&1; then
            echo "mcp-types is installed beside mcp $floor"; exit 1
          fi
      - name: Check
        run: python scripts/check.py ${{ matrix.fresh && '--fresh' || '' }}
